<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogo da Cobrinha — 8ºA</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: black;
    color: white;
    font-family: "Segoe UI", sans-serif;
  }

  canvas {
    display: block;
    margin: auto;
    background: #111;
    border: 2px solid #00ff00;
  }

  #hud {
    position: absolute;
    top: 10px;
    left: 10px;
    font-size: 18px;
    color: #0f0;
  }

  #easterEggBtn {
    position: absolute;
    bottom: 20px;
    right: 20px;
    background: linear-gradient(90deg, red, orange, yellow, green, blue, indigo, violet);
    background-size: 400%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: bold;
    font-size: 20px;
    border: 3px solid white;
    border-radius: 10px;
    padding: 10px 20px;
    cursor: pointer;
    display: none;
    animation: rainbow 4s infinite linear;
  }

  @keyframes rainbow {
    0% { background-position: 0%; }
    100% { background-position: 400%; }
  }

  /* fundo do easter egg */
  #easterEggScreen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: black;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    z-index: 999;
  }

  #scrollingText {
    position: absolute;
    bottom: -100%;
    width: 100%;
    text-align: center;
    color: white;
    font-size: 30px;
    font-weight: bold;
    animation: scrollText 15s linear forwards;
  }

  @keyframes scrollText {
    from { bottom: -100%; }
    to { bottom: 120%; }
  }

  iframe {
    width: 80%;
    height: 80%;
    border: none;
    z-index: 1000;
  }
</style>
</head>
<body>

<canvas id="game" width="400" height="400"></canvas>
<div id="hud">
  Pontos: <span id="score">0</span><br>
  Tempo: <span id="time">0</span>s
</div>
<button id="easterEggBtn">🎉 Easter Egg</button>

<!-- Tela do Easter Egg -->
<div id="easterEggScreen">
  <div id="scrollingText">Matheus Máximo — Marcos Guilherme — Sheila — 8ºA</div>
  <iframe id="easterVideo" src="" allowfullscreen></iframe>
</div>

<script>
document.body.requestFullscreen().catch(()=>{}); // abre fullscreen automático

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let box = 20;
let snake = [{x: 9 * box, y: 10 * box}];
let direction;
let food = {x: Math.floor(Math.random()*19+1)*box, y: Math.floor(Math.random()*19+1)*box};
let score = 0;
let startTime = Date.now();
let interval;

document.addEventListener('keydown', directionControl);

function directionControl(e) {
  if (e.keyCode === 37 && direction !== "RIGHT") direction = "LEFT";
  if (e.keyCode === 38 && direction !== "DOWN") direction = "UP";
  if (e.keyCode === 39 && direction !== "LEFT") direction = "RIGHT";
  if (e.keyCode === 40 && direction !== "UP") direction = "DOWN";
}

function draw() {
  ctx.fillStyle = "#111";
  ctx.fillRect(0, 0, 400, 400);

  for (let i = 0; i < snake.length; i++) {
    ctx.fillStyle = (i === 0) ? "#0f0" : "#0a0";
    ctx.fillRect(snake[i].x, snake[i].y, box, box);
  }

  ctx.fillStyle = "red";
  ctx.fillRect(food.x, food.y, box, box);

  let snakeX = snake[0].x;
  let snakeY = snake[0].y;

  if (direction === "LEFT") snakeX -= box;
  if (direction === "UP") snakeY -= box;
  if (direction === "RIGHT") snakeX += box;
  if (direction === "DOWN") snakeY += box;

  if (snakeX === food.x && snakeY === food.y) {
    score++;
    food = {x: Math.floor(Math.random()*19+1)*box, y: Math.floor(Math.random()*19+1)*box};
    document.getElementById('score').textContent = score;
  } else {
    snake.pop();
  }

  let newHead = {x: snakeX, y: snakeY};

  if (snakeX < 0 || snakeY < 0 || snakeX >= 400 || snakeY >= 400 || collision(newHead, snake)) {
    clearInterval(interval);
    saveLeaderboard();
    alert("Game Over!");
  }

  snake.unshift(newHead);

  let elapsed = Math.floor((Date.now() - startTime) / 1000);
  document.getElementById('time').textContent = elapsed;
}

function collision(head, array) {
  for (let i = 0; i < array.length; i++) {
    if (head.x === array[i].x && head.y === array[i].y) return true;
  }
  return false;
}

interval = setInterval(draw, 100);

// salvar leaderboard (pontuação e tempo)
function saveLeaderboard() {
  let bestScore = localStorage.getItem("snakeBestScore") || 0;
  let bestTime = localStorage.getItem("snakeBestTime") || 0;
  let currentTime = Math.floor((Date.now() - startTime) / 1000);

  if (score > bestScore) localStorage.setItem("snakeBestScore", score);
  if (currentTime > bestTime) localStorage.setItem("snakeBestTime", currentTime);
}

// 🧩 Charada + desbloqueio do botão Easter Egg
setTimeout(() => {
  let resposta = prompt("Charada: O menino que dançou no barco é de qual país?");
  if (resposta && resposta.toLowerCase().includes("indon")) {
    document.getElementById('easterEggBtn').style.display = "block";
    alert("🎉 Você acertou! O botão secreto foi desbloqueado!");
  }
}, 8000);

// 🎬 Ação do botão Easter Egg
const easterBtn = document.getElementById('easterEggBtn');
easterBtn.addEventListener('click', () => {
  document.getElementById('easterEggScreen').style.display = "flex";
  document.getElementById('easterVideo').src = "https://www.youtube.com/embed/KLuHm4ZAvNM?autoplay=1";
});
</script>

</body>
</html>
