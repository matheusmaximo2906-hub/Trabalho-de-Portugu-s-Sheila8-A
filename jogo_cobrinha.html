<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogo da Cobrinha</title>
<style>
    body {
        margin: 0;
        padding: 0;
        background-image: url('https://i.pinimg.com/originals/8c/22/5b/8c225b70cda98f5bda6dfb89c4cb84e7.jpg');
        background-size: cover;
        background-position: center;
        font-family: Arial, sans-serif;
        color: white;
        text-align: center;
    }

    h1 {
        margin-top: 20px;
        font-size: 40px;
        font-weight: bold;
        background: linear-gradient(270deg, red, orange, yellow, green, blue, indigo, violet);
        background-size: 400%;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: rainbow 5s infinite linear;
    }

    @keyframes rainbow {
        0% {background-position: 0%;}
        100% {background-position: 400%;}
    }

    canvas {
        background: rgba(0, 0, 0, 0.6);
        margin-top: 30px;
        border-radius: 10px;
        box-shadow: 0 0 25px rgba(255, 255, 255, 0.2);
    }

    .charadas-frame {
        background: linear-gradient(270deg, red, orange, yellow, green, blue, indigo, violet);
        background-size: 600%;
        animation: rainbow 5s infinite linear;
        padding: 20px;
        border-radius: 20px;
        width: 80%;
        max-width: 900px;
        margin: 40px auto;
        color: black;
        text-align: left;
    }

    .charadas-frame h2 {
        color: white;
        text-align: center;
        text-shadow: 0 0 10px rgba(0,0,0,0.5);
    }

    input {
        width: 90%;
        padding: 10px;
        margin: 10px 0;
        border-radius: 10px;
        border: none;
        outline: none;
    }

    button {
        background: linear-gradient(270deg, red, orange, yellow, green, blue, indigo, violet);
        background-size: 400%;
        color: white;
        font-weight: bold;
        padding: 10px 20px;
        border: none;
        border-radius: 15px;
        cursor: pointer;
        transition: transform 0.2s ease;
        margin: 10px;
        animation: rainbow 5s infinite linear;
    }

    button:hover {
        transform: scale(1.1);
    }

    .easter-egg-btn {
        background: limegreen;
        color: white;
        font-weight: bold;
        padding: 15px 30px;
        border-radius: 20px;
        border: none;
        cursor: pointer;
        display: none;
        margin-top: 20px;
        font-size: 18px;
    }
</style>
</head>
<body>

<h1>Jogo da Cobrinha 🐍</h1>

<canvas id="game" width="400" height="400"></canvas>

<div class="charadas-frame">
    <h2>Charadas — Complete para desbloquear o Easter Egg 🎯</h2>
    <div id="charadas-container"></div>
    <button onclick="verificarRespostas()">Verificar Respostas</button>
</div>

<button id="easterEggButton" class="easter-egg-btn" onclick="abrirEasterEgg()">Liberado para acessar o Easter Egg 🎁</button>

<div style="margin-top: 30px;">
    <button onclick="window.location.href='index.html'">Página Inicial</button>
    <button onclick="window.location.href='pagina2.html'">Página 2</button>
    <button onclick="window.location.href='pagina3.html'">Página 3</button>
</div>

<script>
// --- JOGO DA COBRINHA ---
const canvas = document.getElementById('game');
const context = canvas.getContext('2d');
let box = 20;
let snake = [];
snake[0] = { x: 10 * box, y: 10 * box };
let direction = "RIGHT";
let food = {
    x: Math.floor(Math.random() * 20) * box,
    y: Math.floor(Math.random() * 20) * box
};

document.addEventListener("keydown", directionEvent);

function directionEvent(event) {
    if(event.keyCode == 37 && direction != "RIGHT") direction = "LEFT";
    if(event.keyCode == 38 && direction != "DOWN") direction = "UP";
    if(event.keyCode == 39 && direction != "LEFT") direction = "RIGHT";
    if(event.keyCode == 40 && direction != "UP") direction = "DOWN";
}

function draw() {
    context.fillStyle = "rgba(0,0,0,0.6)";
    context.fillRect(0, 0, 400, 400);

    for(let i = 0; i < snake.length; i++) {
        context.fillStyle = i == 0 ? "lime" : "white";
        context.fillRect(snake[i].x, snake[i].y, box, box);
    }

    context.fillStyle = "red";
    context.fillRect(food.x, food.y, box, box);

    let snakeX = snake[0].x;
    let snakeY = snake[0].y;

    if(direction == "LEFT") snakeX -= box;
    if(direction == "UP") snakeY -= box;
    if(direction == "RIGHT") snakeX += box;
    if(direction == "DOWN") snakeY += box;

    if(snakeX == food.x && snakeY == food.y) {
        food = {
            x: Math.floor(Math.random() * 20) * box,
            y: Math.floor(Math.random() * 20) * box
        };
    } else {
        snake.pop();
    }

    let newHead = { x: snakeX, y: snakeY };

    if(snakeX < 0 || snakeY < 0 || snakeX >= 400 || snakeY >= 400 || collision(newHead, snake))
        return clearInterval(game);

    snake.unshift(newHead);
}

function collision(head, array) {
    for(let i = 0; i < array.length; i++){
        if(head.x == array[i].x && head.y == array[i].y){
            return true;
        }
    }
    return false;
}

let game = setInterval(draw, 100);

// --- CHARADAS ---
const charadas = [
    { pergunta: "O que tem cabeça e dente, mas não é gente?", resposta: "alho" },
    { pergunta: "Qual é a coisa que quanto mais se tira, maior fica?", resposta: "buraco" },
    { pergunta: "O que é, o que é: cai em pé e corre deitado?", resposta: "chuva" },
    { pergunta: "O que é o que é: feito para andar e não anda?", resposta: "estrada" },
    { pergunta: "Tem pescoço, mas não tem cabeça. O que é?", resposta: "garrafa" },
    { pergunta: "O que é que quanto mais quente fica, mais fresco é?", resposta: "banho" },
    { pergunta: "Tem dentes, mas não come. O que é?", resposta: "pente" },
    { pergunta: "É redondo, tem boca, mas não fala. O que é?", resposta: "pote" },
    { pergunta: "O que é que quanto mais cresce, mais baixo fica?", resposta: "prego" },
    { pergunta: "Qual é o lugar mais certo do mundo?", resposta: "correto" }
];

const container = document.getElementById('charadas-container');
charadas.forEach((c, i) => {
    const div = document.createElement('div');
    div.innerHTML = `
        <p><b>${i + 1}.</b> ${c.pergunta}</p>
        <input type="text" id="charada${i}">
    `;
    container.appendChild(div);
});

function verificarRespostas() {
    let acertos = 0;
    charadas.forEach((c, i) => {
        const resposta = document.getElementById(`charada${i}`).value.trim().toLowerCase();
        if(resposta === c.resposta) acertos++;
    });
    if(acertos === charadas.length) {
        alert("Parabéns! Você completou todas as charadas!");
        document.getElementById('easterEggButton').style.display = "inline-block";
    } else {
        alert(`Você acertou ${acertos}/${charadas.length}. Continue tentando!`);
    }
}

// --- EASTER EGG ---
function abrirEasterEgg() {
    const url = "https://www.youtube.com/embed/TQnvTpSgACg?autoplay=1";
    const win = window.open(url, "_blank");
    if(win) {
        win.focus();
        win.document.body.requestFullscreen?.();
    }
}
</script>

</body>
</html>
