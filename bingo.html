<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bingo — Modo Online / Offline</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #eef;
        text-align: center;
        padding: 20px;
    }

    .menu, .onlineMenu, .gameArea, .offlineArea {
        display: none;
    }

    button {
        padding: 12px 20px;
        font-size: 18px;
        margin: 10px;
        cursor: pointer;
        border-radius: 6px;
    }

    input {
        padding: 10px;
        font-size: 18px;
    }
</style>
</head>
<body>

<h1>Bingo Escolar</h1>

<!-- ------------ MENU PRINCIPAL ------------ -->
<div id="menu" class="menu" style="display:block;">
    <button onclick="abrirOnline()">Modo Online</button>
    <button onclick="abrirOffline()">Modo Roleta (Offline)</button>
    <br><br>
    <a href="index.html"><button>Voltar para Index</button></a>
    <a href="creditos.html"><button>Créditos</button></a>
</div>

<!-- ------------ MENU ONLINE ------------ -->
<div id="onlineMenu" class="onlineMenu">
    <h2>Modo Online</h2>
    <button onclick="criarSala()">Criar Sala</button><br>

    <h3>Entrar em sala existente:</h3>
    <input id="codigoInput" maxlength="6" placeholder="Código da sala"><br>
    <button onclick="entrarSala()">Entrar</button><br><br>

    <button onclick="voltarMenu()">Voltar</button>
</div>

<!-- ------------ ÁREA DE JOGO ONLINE ------------ -->
<div id="gameArea" class="gameArea">
    <h2 id="codigoSalaTitulo"></h2>
    <p>Jogadores na sala:</p>
    <p id="listaJogadores">Carregando...</p>

    <button onclick="iniciarSorteio()">Iniciar Sorteio</button>
    <button onclick="sairSala()">Sair da Sala</button>

    <h3>Sua Cartela:</h3>
    <div id="cartela"></div>

    <h3>Números sorteados:</h3>
    <p id="sorteados">Nenhum ainda</p>
</div>

<!-- ------------ MODO OFFLINE ------------ -->
<div id="offlineArea" class="offlineArea">
    <h2>Roleta Offline</h2>
    <button onclick="sortearPergunta()">Sortear Pergunta</button>
    <p id="pergunta"></p>

    <br>
    <button onclick="voltarMenu()">Voltar</button>
</div>

<!-- ======================= FIREBASE ======================= -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
    import { getDatabase, ref, get, set, update, push, onValue, remove }
        from "https://www.gstatic.com/firebasejs/10.13.2/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAnbQm4xGjuGuV2kRilvod8wk7lrknXYbg",
        authDomain: "bingo-2923d.firebaseapp.com",
        databaseURL: "https://bingo-2923d-default-rtdb.firebaseio.com/",
        projectId: "bingo-2923d",
        storageBucket: "bingo-2923d.firebasestorage.app",
        messagingSenderId: "641887131012",
        appId: "1:641887131012:web:0b932028f09ed0f62179d1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let salaAtual = null;
    let jogadorID = Math.floor(Math.random()*999999999);

    // ------------------- TELAS -------------------
    function abrirOnline() {
        esconderTudo();
        document.getElementById("onlineMenu").style.display = "block";
    }

    function abrirOffline() {
        esconderTudo();
        document.getElementById("offlineArea").style.display = "block";
    }

    function voltarMenu() {
        esconderTudo();
        document.getElementById("menu").style.display = "block";
    }

    function esconderTudo() {
        document.querySelectorAll(".menu, .onlineMenu, .gameArea, .offlineArea")
            .forEach(e => e.style.display = "none");
    }

    // ------------------- CRIAR SALA -------------------
    function criarCodigoSala() {
        return Math.floor(100000 + Math.random()*900000).toString();
    }

    async function criarSala() {
        const codigo = criarCodigoSala();
        salaAtual = codigo;

        const salaRef = ref(db, "salas/" + codigo);

        await set(salaRef, {
            jogadores: {},
            sorteios: []
        });

        entrarComoJogador();
    }

    // ------------------- ENTRAR EM SALA -------------------
    async function entrarSala() {
        const codigo = document.getElementById("codigoInput").value;

        if (codigo.length !== 6) {
            alert("Código deve ter 6 dígitos.");
            return;
        }

        const salaRef = ref(db, "salas/" + codigo);
        const snap = await get(salaRef);

        if (!snap.exists()) {
            alert("Sala não encontrada.");
            return;
        }

        salaAtual = codigo;
        entrarComoJogador();
    }

    // ------------------- REGISTRA JOGADOR -------------------
    async function entrarComoJogador() {
        const jogadorRef = ref(db, `salas/${salaAtual}/jogadores/${jogadorID}`);
        await set(jogadorRef, {
            cartela: gerarCartela(),
        });

        abrirSala();
        atualizarListaJogadores();
        sincronizarSorteio();
    }

    // ------------------- MOSTRAR TELA DA SALA -------------------
    function abrirSala() {
        esconderTudo();
        document.getElementById("gameArea").style.display = "block";
        document.getElementById("codigoSalaTitulo").innerText = "Sala: " + salaAtual;
    }

    // ------------------- LISTA DE JOGADORES -------------------
    function atualizarListaJogadores() {
        const jogadoresRef = ref(db, `salas/${salaAtual}/jogadores`);

        onValue(jogadoresRef, snap => {
            if (!snap.exists()) return;

            const dados = snap.val();
            const nomes = Object.keys(dados);

            document.getElementById("listaJogadores").innerText =
                nomes.length + " jogador(es) conectado(s)";
        });
    }

    // ------------------- GERAR CARTELA -------------------
    function gerarCartela() {
        const setNum = new Set();
        while (setNum.size < 25) {
            setNum.add(Math.floor(Math.random()*75)+1);
        }
        return Array.from(setNum);
    }

    // ------------------- SORTEAR NÚMEROS -------------------
    async function iniciarSorteio() {
        const n = Math.floor(Math.random()*75)+1;
        const atual = ref(db, `salas/${salaAtual}/sorteios`);

        const snap = await get(atual);
        let arr = snap.exists() ? snap.val() : [];

        if (arr.includes(n)) return iniciarSorteio(); // evitar repetição

        arr.push(n);
        await set(atual, arr);
    }

    // ------------------- SINCRONIZAR SORTEIO -------------------
    function sincronizarSorteio() {
        const sorteiosRef = ref(db, `salas/${salaAtual}/sorteios`);

        onValue(sorteiosRef, snap => {
            if (!snap.exists()) return;

            const arr = snap.val();
            document.getElementById("sorteados").innerText = arr.join(", ");
        });
    }

    // ------------------- SAIR DA SALA -------------------
    async function sairSala() {
        await remove(ref(db, `salas/${salaAtual}/jogadores/${jogadorID}`));
        salaAtual = null;
        voltarMenu();
    }

    // ------------------- ROLETAA OFFLINE (FUNCIONA DEPOIS) -------------------
    function sortearPergunta() {
        document.getElementById("pergunta").innerText = 
            "As perguntas serão adicionadas na PARTE 3!";
    }

</script>

</body>
</html>
